
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/checkout.css">
</head>
<body>

<main class="container py-5">

    <h2 class="text-center fw-bold mb-4 page-title">THANH TOÁN</h2>

    <form id="checkout-form" novalidate>

        <div class="row g-4">

            <!-- THÔNG TIN KHÁCH HÀNG -->
            <div class="col-lg-7">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body p-4">

                        <h5 class="fw-bold section-title mb-4">
                            THÔNG TIN THANH TOÁN
                        </h5>

                        <div class="mb-3">
                            <label class="form-label">Họ và tên *</label>
                            <input type="text" class="form-control"
                                   id="fullname" placeholder="Nhập họ và tên" required>
                            <small class="error-message"></small>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Số điện thoại *</label>
                                <input type="tel" class="form-control"
                                       id="phone" placeholder="Nhập số điện thoại" required>
                                <small class="error-message"></small>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Email *</label>
                                <input type="email" class="form-control"
                                       id="email" placeholder="example@gmail.com" required>
                                <small class="error-message"></small>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Địa chỉ nhận hàng *</label>
                            <input type="text" class="form-control"
                                   id="address" placeholder="Số nhà, tên đường..." required>
                            <small class="error-message"></small>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Tỉnh / Thành phố *</label>
                                <select class="form-select" id="city" required>
                                    <option value="">-- Chọn tỉnh/thành phố --</option>
                                    <option>TP. Hồ Chí Minh</option>
                                    <option>Hà Nội</option>
                                    <option>Đà Nẵng</option>
                                    <option>Cần Thơ</option>
                                    <option>Tỉnh khác</option>
                                </select>
                                <small class="error-message"></small>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Quận / Huyện</label>
                                <input type="text" class="form-control"
                                       id="district" placeholder="Nhập quận/huyện">
                                <small class="error-message"></small>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Ghi chú đơn hàng</label>
                            <textarea class="form-control" id="note" rows="3"
                                      placeholder="Ghi chú thêm (nếu có)..."></textarea>
                        </div>

                        <a href="../../DetailProduct/html/iPhone16proDetail.html"
                           class="back-arrow">←</a>

                    </div>
                </div>
            </div>

            <!-- ĐƠN HÀNG -->
            <div class="col-lg-5">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">

                        <h5 class="fw-bold section-title mb-4">
                            ĐƠN HÀNG CỦA BẠN
                        </h5>

                        <div id="order-items">
                            <!-- Sản phẩm được hiển thị bằng JavaScript -->
                        </div>

                        <hr>

                        <div class="d-flex justify-content-between mb-2">
                            <span>Tạm tính</span>
                            <strong id="subtotal">0đ</strong>
                        </div>

                        <div class="d-flex justify-content-between mb-2">
                            <span>Phí giao hàng</span>
                            <strong id="shipping">Miễn phí</strong>
                        </div>

                        <hr>

                        <div class="d-flex justify-content-between total-price mb-4">
                            <span>TỔNG CỘNG</span>
                            <strong id="total">0đ</strong>
                        </div>

                        <!-- PHƯƠNG THỨC THANH TOÁN -->
                        <h6 class="fw-bold mb-3">PHƯƠNG THỨC THANH TOÁN</h6>

                        <div class="payment-option p-3 mb-2 rounded">
                            <div class="form-check">
                                <input class="form-check-input" type="radio"
                                       name="payment" id="bank"
                                       value="Chuyển khoản" checked>
                                <label class="form-check-label fw-bold" for="bank">
                                    Chuyển khoản ngân hàng
                                </label>
                            </div>
                            <small class="text-secondary">
                                Thanh toán bằng cách chuyển khoản ngân hàng.
                            </small>
                        </div>

                        <div class="payment-option p-3 mb-4 rounded">
                            <div class="form-check">
                                <input class="form-check-input" type="radio"
                                       name="payment" id="cod" value="COD">
                                <label class="form-check-label fw-bold" for="cod">
                                    Trả tiền mặt khi nhận hàng (COD)
                                </label>
                            </div>
                            <small class="text-secondary">
                                Thanh toán trực tiếp khi nhận được sản phẩm.
                            </small>
                        </div>

                        <button type="submit" class="btn btn-checkout w-100 py-2">
                            ĐẶT HÀNG
                        </button>

                        <a href="../../GioHang/html/index.html"
                           class="btn btn-outline-dark w-100 mt-2">
                            Quay lại giỏ hàng
                        </a>

                    </div>
                </div>
            </div>

        </div>
    </form>

</main>

<script src="../js/checkout.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

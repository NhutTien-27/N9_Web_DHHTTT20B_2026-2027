<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên hệ với chúng tôi</title>
    <link rel="stylesheet" href="../css/contact.css">
    <!-- FontAwesome cho Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <section class="contact-container">

        <div class="contact-header">
            <a href="../../Home/html/home.html">
                <img src="../img/home.png" class = "home-logo">
            </a>
            <div>
                <h2>Liên Hệ Với Chúng Tôi</h2>
                <p>Nếu bạn có bất kỳ thắc mắc hoặc góp ý nào, vui lòng để lại lời nhắn bên dưới.</p>
            </div>
        </div>

        <div class="contact-content">
            <!-- Thông tin liên hệ -->
            <div class="contact-info">
                <h3>Thông Tin Liên Hệ</h3>
                
                <div class="info-item">
                    <i class="fa-solid fa-location-dot"></i>
                    <div>
                        <strong>Địa chỉ:</strong>
                        <p>123 Đường ABC, Quận 1, TP. Hồ Chí Minh</p>
                    </div>
                </div>

                <div class="info-item">
                    <i class="fa-solid fa-phone"></i>
                    <div>
                        <strong>Điện thoại:</strong>
                        <p>+84 123 456 789</p>
                    </div>
                </div>

                <div class="info-item">
                    <i class="fa-solid fa-envelope"></i>
                    <div>
                        <strong>Email:</strong>
                        <p>support@domain.com</p>
                    </div>
                </div>

                <!-- Mạng xã hội -->
                <div class="social-links">
                    <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
                    <a href="#"><i class="fa-brands fa-instagram"></i></a>
                    <a href="#"><i class="fa-brands fa-twitter"></i></a>
                </div>
            </div>

            <!-- Form gửi lời nhắn -->
            <div class="contact-form">
                <h3>Gửi Phản Hồi</h3>
                <form action="#" method="POST">
                    <div class="input-group">
                        <label for="name">Họ và tên</label>
                        <input type="text" id="name" name="name" placeholder="Nhập họ và tên..." required>
                    </div>

                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Nhập email của bạn..." required>
                    </div>

                    <div class="input-group">
                        <label for="subject">Chủ đề</label>
                        <input type="text" id="subject" name="subject" placeholder="Tiêu đề lời nhắn..." required>
                    </div>

                    <div class="input-group">
                        <label for="message">Nội dung</label>
                        <textarea id="message" name="message" rows="5" placeholder="Nhập nội dung lời nhắn..." required></textarea>
                    </div>

                    <button type="submit" class="btn-submit">Gửi Tin Nhắn</button>
                </form>
            </div>
        </div>

        <!-- Bản đồ Google Maps nhúng -->
        <div class="contact-map">
            <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3919.4946681007846!2d106.6997639!3d10.7756587!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x31752f4679782987%3A0x6b7774e1d906e00b!2zQ2jhu6MgQsOqbiBUaMOgbmggLSBRdeG6rW4gMQ!5e0!3m2!1svi!2s!4v1700000000000!5m2!1svi!2s" 
                width="100%" 
                height="350" 
                style="border:0;" 
                allowfullscreen="" 
                loading="lazy">
            </iframe>
        </div>
    </section>

</body>
</html>

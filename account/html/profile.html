<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ cá nhân</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="../../Home/html/home.html">Trang chủ</a>
            <button class="btn btn-outline-light btn-sm" id="logoutBtn">Đăng xuất</button>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="card shadow p-4 mx-auto" style="max-width: 600px;">
            <h3 class="mb-4 text-center">Thông tin tài khoản</h3>
            
            <p><strong>Họ và Tên:</strong> <span id="lblUsername">Đang tải...</span></p>
            <p><strong>Số điện thoại:</strong> <span id="lblPhone">Đang tải...</span></p>
            <p><strong>Email:</strong> <span id="lblEmail">Đang tải...</span></p>
            <p><strong>Địa chỉ:</strong> <span id="lblAddress">Đang tải...</span></p>

            <div class="d-flex justify-content-between mt-4">
                <a href="../../Home/html/home.html" class="btn btn-secondary">Quay lại trang chủ</a>
                <!-- Nút bấm chuyển sang trang "web khác" để chỉnh sửa -->
                <a href="edit-profile.html" class="btn btn-primary">Chỉnh sửa thông tin</a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const currentUser = JSON.parse(localStorage.getItem("userLogin"));
            if (!currentUser) {
                alert("Vui lòng đăng nhập!");
                window.location.href = "login.html";
                return;
            }

            // Hiển thị thông tin ra màn hình
            document.getElementById("lblUsername").textContent = currentUser.username || "Chưa cập nhật";
            document.getElementById("lblPhone").textContent = currentUser.phone || "Chưa cập nhật";
            document.getElementById("lblEmail").textContent = currentUser.email || "Chưa cập nhật";
            document.getElementById("lblAddress").textContent = currentUser.address || "Chưa cập nhật";

            // Đăng xuất
            document.getElementById("logoutBtn").addEventListener("click", function () {
                localStorage.removeItem("userLogin");
                window.location.href = "../../Home/html/home.html";
            });
        });
    </script>
</body>
</html>

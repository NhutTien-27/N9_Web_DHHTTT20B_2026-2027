
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/register.css" rel="stylesheet">
</head>

<body>

    <div class="container d-flex justify-content-center align-items-center">

        <form id="formRegister" novalidate>

            <h3 class="text-center mb-4">Đăng ký tài khoản</h3>

            <!-- HỌ VÀ TÊN -->
            <div class="mb-3">
                <label for="username" class="form-label">Họ và Tên</label>
                <input type="text" class="form-control"
                       id="username" placeholder="Nhập Họ và Tên">

                <div id="usernameError" class="error-message"></div>
            </div>

            <!-- EMAIL -->
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="text" class="form-control"
                       id="email" placeholder="Nhập Email">

                <div id="emailError" class="error-message"></div>
            </div>

            <!-- SỐ ĐIỆN THOẠI -->
            <div class="mb-3">
                <label for="phone" class="form-label">Số điện thoại</label>
                <input type="text" class="form-control"
                       id="phone" placeholder="Nhập số điện thoại">

                <div id="phoneError" class="error-message"></div>
            </div>

            <!-- MẬT KHẨU -->
            <div class="mb-3">
                <label for="password" class="form-label">Mật khẩu</label>
                <input type="password" class="form-control"
                       id="password" placeholder="Nhập mật khẩu">

                <div id="passwordError" class="error-message"></div>
            </div>

            <!-- NHẬP LẠI MẬT KHẨU -->
            <div class="mb-3">
                <label for="repassword" class="form-label">Nhập lại mật khẩu</label>
                <input type="password" class="form-control"
                       id="repassword" placeholder="Nhập lại mật khẩu">

                <div id="repasswordError" class="error-message"></div>
            </div>

            <!-- ĐỊA CHỈ -->
            <div class="mb-3">
                <label for="address" class="form-label">Địa chỉ</label>
                <textarea class="form-control" id="address"
                          rows="3" placeholder="Nhập địa chỉ"></textarea>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Đăng Ký
            </button>

            <p class="text-center mt-3">
                Bạn đã có tài khoản?
                <a href="./login.html">Đăng nhập</a>
            </p>

        </form>

    </div>

    <script src="../js/register.js"></script>

</body>
</html>

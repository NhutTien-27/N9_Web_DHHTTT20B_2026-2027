<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng</title>

    <!-- CSS Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- CSS riêng -->
    <link rel="stylesheet" href="../css/style.css">

    <!-- Font Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">
</head>
  <body>
    <!-----------------------------------header start----------------------------------------------->
    <!-----------------------------------header start----------------------------------------------->
    <header class = "home-header row ">

        <!------------logo-------------->
        <div class = "header-logo col-4 d-flex justify-content-center align-items-center ">
            <img src = "../img/logo.png" alt = "logo" class = "object-fit-container ">
        </div>

        <!--------------------Thanh tìm kiếm và menu------------------>
        <div class = "header-center col-5 d-flex flex-column justify-content-between  mt-3 ">

            <!--------thanh tìm kiếm----------->
            <div class = "header-search">
                <form action = "" method = "get" class = "d-flex flex-row" >
                    <input type = "text" id = "search" placeholder = "Tìm kiếm sản phẩm......" class = "form-control">
                    <button type = "submit" class = "btn btn-primary">Go</button>
                </form>
            </div>
            <!------------------------menu------------------>
            <div class="header-menu">
                <nav class="navbar">
                <ul class="d-flex flex-row gap-5 mb-0 list-unstyled align-items-center">

                    <li class="nav-item"><a class="nav-link" href="../../Home/html/home.html">Trang chủ</a></li>
                    <!--dùng dropdown trong bootstrap để tạo lựa chọn-->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle"
                                    href="#"
                                    role="button"
                                    data-bs-toggle="dropdown"
                                    aria-expanded="false">
                            Sản phẩm
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="../../iPhoneProduct/html/iphone.html">iPhone</a></li>
                            <li><a class="dropdown-item" href="../../MacBookProduct/html/MacBook.html"> MacBook</a></li>
                        </ul>
                    </li>

                    <li class="nav-item"><a class="nav-link" href="../../about/html/about.html">Giới thiệu</a></li><!--chưa liên kết với trang about-->
                    <li class="nav-item"><a class="nav-link" href="../../Contact/html/contact.html">Liên hệ</a></li><!--chưa liên kết với trang contact-->
                </ul>
                </nav>
            </div>

        </div>
        <!-------------------account và giỏ hàng------------------------->
        <div class = "header-right col-3 d-flex flex-column justify-content-between  ">

            <div class = "header-account d-flex  align-items-center">
                <img src = "../img/account.png" alt = "account" href = "../../account/html/login.html" class = "me-2 object-fit-cover" >
                <span><a href = "../../account/html/login.html">Tài khoản</a></span>
            </div>

            <div class = "header-GioHang">
                <img src = "../img/GioHang.png" alt = "cart" href="../../GioHang/html/index.html" class = "me-2 object-fit-cover">
                <span><a href = "../../GioHang/html/index.html">Giỏ hàng</a></span>
            </div>
        </div>
    </header>
<!-----------------------------------header end------------------------------------------------>
<!-----------------------------------header end------------------------------------------------>



    <!-- Main Content -->
    <main class="cart-main">
      <div class="cart-container">
        <!-- Bảng sản phẩm -->
        <div class="cart-table-header">
          <div class="col-check">
            <input type="checkbox" id="check-all" />
          </div>
          <div class="col-product">Sản Phẩm</div>
          <div class="col-price">Đơn Giá</div>
          <div class="col-quantity">Số Lượng</div>
          <div class="col-total">Số Tiền</div>
          <div class="col-action">Thao Tác</div>
        </div>

        <!-- Danh sách sản phẩm được render từ JS -->
        <div id="cart-list" class="cart-list"></div>

        <!-- Thanh thanh toán cố định bên dưới -->
        <div class="cart-footer">
          <div class="footer-left">
            <input type="checkbox" id="check-all-footer" />
            <label for="check-all-footer"
              >Chọn Tất Cả (<span id="total-items-count">0</span>)</label
            >
            <button id="btn-delete-selected" class="btn-link">
              Xóa mục đã chọn
            </button>
          </div>
          <div class="footer-right">
            <div class="total-price-box">
              <span class="total-text"
                >Tổng thanh toán (<span id="selected-count">0</span> sản
                phẩm):</span
              >
              <span class="total-amount" id="final-total">0đ</span>
            </div>
            <a href="../../ThanhToan/html/index.html">
               <button class="btn-checkout" id="btn-checkout">Mua Hàng</button>
            </a>
             
           
            
          </div>
        </div>
      </div>
    </main>
      <script src="../js/cart.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
